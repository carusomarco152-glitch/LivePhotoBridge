name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build core package
        run: swift build

      - name: Test core package
        run: swift test

      - name: Build iOS app
        run: |
          xcodebuild \
            -project LivePhotoBridgeApp/LivePhotoBridgeApp.xcodeproj \
            -scheme LivePhotoBridge \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package clean unsigned IPA for SideStore
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Release-iphoneos/LivePhotoBridge.app' -print -quit)
          test -n "$APP_PATH"

          rm -rf artifacts Payload
          mkdir -p artifacts Payload
          cp -R "$APP_PATH" Payload/LivePhotoBridge.app

          cd Payload
          zip -qry ../artifacts/LivePhotoBridge-SideStore.ipa LivePhotoBridge.app
          cd ..
          rm -rf Payload

          test -f artifacts/LivePhotoBridge-SideStore.ipa
          unzip -l artifacts/LivePhotoBridge-SideStore.ipa

      - name: Upload IPA only
        uses: actions/upload-artifact@v4
        with:
          name: LivePhotoBridge-SideStore-IPA
          path: artifacts/LivePhotoBridge-SideStore.ipa
          if-no-files-found: error
          retention-days: 7

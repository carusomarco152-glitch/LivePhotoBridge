name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build core package
        run: swift build

      - name: Test core package
        run: swift test

      - name: Build iOS app
        run: |
          xcodebuild \
            -project LivePhotoBridgeApp/LivePhotoBridgeApp.xcodeproj \
            -scheme LivePhotoBridge \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package clean unsigned IPA for SideStore
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Release-iphoneos/LivePhotoBridge.app' -print -quit)
          test -n "$APP_PATH"

          rm -rf artifacts Payload
          mkdir -p artifacts Payload
          cp -R "$APP_PATH" Payload/LivePhotoBridge.app

          # An IPA must contain a top-level Payload directory.
          # Do not cd into Payload before zipping, otherwise SideStore
          # cannot find Payload and reports "No such file or directory".
          zip -qry artifacts/LivePhotoBridge-SideStore.ipa Payload

          rm -rf Payload

          test -f artifacts/LivePhotoBridge-SideStore.ipa
          unzip -l artifacts/LivePhotoBridge-SideStore.ipa

          # Fail the build if the IPA does not have the required structure.
          unzip -Z1 artifacts/LivePhotoBridge-SideStore.ipa | grep -q '^Payload/LivePhotoBridge.app/'

      - name: Upload IPA only
        uses: actions/upload-artifact@v4
        with:
          name: LivePhotoBridge-SideStore-IPA
          path: artifacts/LivePhotoBridge-SideStore.ipa
          if-no-files-found: error
          retention-days: 7
